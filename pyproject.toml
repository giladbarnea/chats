[project]
name = "chats"
version = "0.1.0"
description = "CLI for parsing and querying Claude Code conversations"
readme = "README.md"
authors = [
    { name = "Gilad Barnea", email = "gilad@hear.ai" }
]
requires-python = ">=3.13"
dependencies = [
    "nltk>=3.9.4",
    "orjson>=3.11.5",
    "pyyaml>=6.0.3",
    "rich",
]

[project.scripts]
ch = "chats.cli:main"

[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "chats._native"
python-source = "src"
features = ["extension-module"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
addopts = ["-q", "-ra", "--tb=short"]
