[project]
name = "chats"
version = "0.1.0"
description = "CLI for parsing and querying Claude Code conversations"
readme = "README.md"
authors = [
    { name = "Gilad Barnea", email = "gilad@hear.ai" }
]
requires-python = "==3.14.*"
dependencies = [
    "nltk>=3.9.4",
    "orjson>=3.11.5",
    "pyyaml>=6.0.3",
    "rich",
]

[project.scripts]
ch-legacy = "chats.cli:main"

[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.13"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["src"] }

[[tool.setuptools-rust.ext-modules]]
target = "chats._native"
features = ["extension-module"]
py-limited-api = true
debug = false

[[tool.setuptools-rust.bins]]
target = "ch"
args = ["--no-default-features"]
debug = false

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
addopts = ["-q", "-ra", "--tb=short"]
